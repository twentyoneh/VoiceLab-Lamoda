<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceLab — Аналитика диалогов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ─── Dark theme (default) ─── */
      :root {
        --bg:           #08080C;
        --bg-elev:      #0F0F17;
        --bg-card:      #13131D;
        --bg-card-h:    #1A1A26;
        --text:         #F4F4F8;
        --text-muted:   #9CA3AF;
        --text-dim:     #6B7280;
        --accent:       #6366F1;
        --accent-2:     #8B5CF6;
        --accent-3:     #06B6D4;
        --success:      #10B981;
        --warning:      #F59E0B;
        --danger:       #EF4444;
        --border:       rgba(255,255,255,0.08);
        --border-s:     rgba(255,255,255,0.14);
        --grad:         linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#EC4899 100%);
        --grad-2:       linear-gradient(135deg,#06B6D4 0%,#6366F1 100%);
        --radius-sm:    10px;
        --radius:       14px;
        --radius-lg:    20px;
        --shadow:       0 16px 48px rgba(0,0,0,0.55),0 0 0 1px rgba(99,102,241,0.1);

        /* Theme-sensitive values used in JS inline styles */
        --row-alt:      rgba(255,255,255,0.012);
        --track-bg:     rgba(255,255,255,0.06);
        --chart-grid:   rgba(255,255,255,0.05);
        --row-border:   rgba(255,255,255,0.04);
        --topbar-bg:    rgba(8,8,12,0.85);

        /* Recharts tooltip (read by JS) */
        --tt-bg:        #13131D;
        --tt-border:    rgba(255,255,255,0.1);
        --tt-color:     #F4F4F8;
        --chart-cursor: rgba(255,255,255,0.03);
      }

      /* ─── Light theme ─── */
      html.light {
        --bg:           #F1F5F9;
        --bg-elev:      #FFFFFF;
        --bg-card:      #FFFFFF;
        --bg-card-h:    #F8FAFC;
        --text:         #0F172A;
        --text-muted:   #475569;
        --text-dim:     #94A3B8;
        --border:       rgba(0,0,0,0.08);
        --border-s:     rgba(0,0,0,0.14);
        --shadow:       0 4px 24px rgba(0,0,0,0.08),0 0 0 1px rgba(99,102,241,0.08);

        --row-alt:      rgba(0,0,0,0.015);
        --track-bg:     rgba(0,0,0,0.07);
        --chart-grid:   rgba(0,0,0,0.06);
        --row-border:   rgba(0,0,0,0.06);
        --topbar-bg:    rgba(255,255,255,0.9);

        --tt-bg:        #FFFFFF;
        --tt-border:    rgba(0,0,0,0.1);
        --tt-color:     #0F172A;
        --chart-cursor: rgba(0,0,0,0.03);
      }

      html, body { height: 100%; background: var(--bg); color: var(--text); }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        transition: background .2s, color .2s;
      }
      #root { height: 100%; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-elev); }
      ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.25); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.45); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
